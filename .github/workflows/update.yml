name: Update program
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-program.mjs
      - run: |
          git config user.name "program-bot"
          git config user.email "program-bot@users.noreply.github.com"
          git add program.json
          git diff --cached --quiet || (git commit -m "Update program" && git push)
